name: air_orchestrator

services:
  minio:
    image: coollabsio/minio:latest
    container_name: airorc_minio
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"
    command: server /data --address ":9000"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password.txt
      MINIO_SERVER_URL: https://${DOMAIN}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio_data:/data
      - ../configs/secrets/minio_root_password.txt:/run/secrets/minio_root_password.txt:ro
    expose:
      - "9000"
    networks:
      - app_internal
      - air_shared
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6

  minio-init:
    image: bitnamilegacy/minio-client:latest
    user: "root"
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password.txt
      REAL_URL: ${DOMAIN}
    volumes:
      - ../configs/secrets/minio_root_password.txt:/run/secrets/minio_root_password.txt:ro
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        mc alias set local http://minio:9000 root "$$(cat /run/secrets/minio_root_password.txt)"
        mc mb --ignore-existing local/user-files
    networks:
      - app_internal

volumes:
  minio_data:
    name: airorc_minio_data

networks:
  app_internal:
    name: app_internal
    external: true
  air_shared:
    name: air_shared
    external: true
