name: air_orchestrator

services:
  airorc:
    build:
      context: ..
      dockerfile: build/Dockerfile
      args:
        GO_BUILD_TAGS: ""
    image: airorc:dev
    container_name: airorc_app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"
    volumes:
      - ../configs/secrets:/run/secrets:ro
      - ../test.html:/app/test.html:ro # можно удалить
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - DEVELOPMENT=true
      - NOTIF_TG_IDS=${TG_IDS}
      - DB_HOST=air_db:3306
      - DB_NAME=air
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REAL_URL=localhost
      - MINIO_PUBLIC_INSECURE=true
      - MINIO_PUBLIC_PROXY=envoy:443
      - GRPC_PORT=50051
      - LOG_LEVEL=debug
      - SWAGGER_ENABLED=true
      - APP_MASTER_KEY_FILE=/run/secrets/app_master_key.txt
      - NEW_APP_MASTER_KEY_FILE=/run/secrets/new_app_master_key.txt
      - APP_CONFIG_REKEY=false
      - GLOB_USER_MODEL_TTL=1440
      - REDIS_ADDR=air_redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - MINIO_INTERNAL_ENDPOINT=minio:9000
      - MINIO_BUCKET=user-files
      - MINIO_ACCESS_KEY=root
      - MINIO_SECRET_KEY_FILE=/run/secrets/minio_root_password.txt
      # ── SQL время отмены контекста долгих операций в секундах ──────────────────────────────────────────────────────
      - GLOB_SQL_CTX_CANCEL=1
      # Phase 2: read channels from user_channels/user_channel_configs.
      # Phase 1: generate Snowflake IDs for new entities (users/dialogs/...).
      - IDGEN_ENABLED=${IDGEN_ENABLED:-true}
      - CHANNELS_V2_READ_ENABLED=${CHANNELS_V2_READ_ENABLED:-false}
      # Phase 3: read dialogs contexts/messages from dialog_messages/dialog_contexts.
      - DIALOG_MESSAGES_READ_ENABLED=${DIALOG_MESSAGES_READ_ENABLED:-false}
      # MCP: общий секрет для HMAC-подписи X-Session-ID и запрет legacy-формата.
      - MCP_SESSION_SECRET=${MCP_SESSION_SECRET:-}
      - MCP_REQUIRE_SIGNED_SESSION=${MCP_REQUIRE_SIGNED_SESSION:-false}
      - MCP_SERVICE_KEY=${MCP_SERVICE_KEY:-}
      # Phase 6: shard routing (пусто = single-DB режим).
      - DB_SHARDS_CONFIG=${DB_SHARDS_CONFIG:-}
      - DB_SHARDS_CONFIG_FILE=${DB_SHARDS_CONFIG_FILE:-}
      - DB_SHARD0_DSN=${DB_SHARD0_DSN:-}
      - SHARD_STRICT=${SHARD_STRICT:-false}
      # OpenTelemetry: пусто = трассировка отключена.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      # Phase 4.3: soft-delete + фоновый purge.
      - USER_DELETE_SOFT=${USER_DELETE_SOFT:-false}
      - USER_DELETE_GRACE=${USER_DELETE_GRACE:-24h}
      - USER_PURGE_INTERVAL=${USER_PURGE_INTERVAL:-1h}
      # Финальная миграция: после deadline (по умолчанию 2026-12-31T23:59:59Z)
      # немигрировавшие пользователи и их данные удаляются, EmailHash -> NOT NULL.
      - USER_MIGRATION_DEADLINE=${USER_MIGRATION_DEADLINE:-2026-12-31T23:59:59Z}
      - USER_MIGRATION_FINALIZE=${USER_MIGRATION_FINALIZE:-true}
      - USER_MIGRATION_CHECK_INTERVAL=${USER_MIGRATION_CHECK_INTERVAL:-1h}
      # Retention исторических таблиц (по умолчанию выключена).
      - RETENTION_ENABLED=${RETENTION_ENABLED:-false}
      - RETENTION_INTERVAL=${RETENTION_INTERVAL:-6h}
      - USER_BOT_EVENTS_RETENTION=${USER_BOT_EVENTS_RETENTION:-2160h}
      - AUDIT_LOG_RETENTION=${AUDIT_LOG_RETENTION:-8760h}
      - WEBHOOK_DEDUP_RETENTION=${WEBHOOK_DEDUP_RETENTION:-168h}
    ports:
      # gRPC ConfigService напрямую с хоста (для нативных клиентов, напр. air_phantom).
      - "50051:50051"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_internal
      - air_shared
      - monitoring_shared

  envoy:
    image: envoyproxy/envoy:v1.32-latest
    container_name: airorc_envoy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"
    ports:
      - "443:443"
      - "50443:50443"  # gRPC-Web endpoint for the local frontend
      - "3006:3006"  # Порт БД для внешнего доступа через Envoy
    volumes:
      - ../envoy/envoy.dev.yaml:/etc/envoy/envoy.yaml:ro
      - ../localhost.pem:/etc/envoy/certs/localhost.pem:ro
      - ../localhost-key.pem:/etc/envoy/certs/localhost-key.pem:ro
      - ../host.pem:/etc/envoy/certs/host.pem:ro
      - ../host-key.pem:/etc/envoy/certs/host-key.pem:ro
    depends_on:
      - airorc
    networks:
      - app_internal
      - air_shared

networks:
  app_internal:
    name: app_internal
    driver: bridge
    external: true
  air_shared:
    name: air_shared
    external: true
  monitoring_shared:
    name: monitoring_shared
    external: true
