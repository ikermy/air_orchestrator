name: air_orchestrator

services:
  air_db:
    image: mariadb:13.0.1-rc
    container_name: air_db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"
    ports:
      - "3307:3306"  # <--- Проброс порта делает Envoy
    environment:
      - MYSQL_DATABASE=air
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/mysql_root_password.txt
    volumes:
      - ../mysql_data:/var/lib/mysql
      - ../configs/secrets:/run/secrets:ro
    networks:
      - air_shared

networks:
  air_shared:
    name: air_shared
    external: true