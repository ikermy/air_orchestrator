services:
  airorc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_BUILD_TAGS: ""
    image: airorc:dev
    container_name: airorc_app
    restart: unless-stopped
    volumes:
      - ./secrets:/run/secrets:ro
      - ./test.html:/app/test.html:ro # можно удалить
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - DEVELOPMENT=true
      - NOTIF_TG_IDS=${TG_IDS}
      - DB_HOST=air_db:3306
      - DB_NAME=air
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REAL_URL=localhost
      - MINIO_PUBLIC_INSECURE=true
      - MINIO_PUBLIC_PROXY=envoy:443
      - GRPC_PORT=50051
      - LOG_LEVEL=debug
      - SWAGGER_ENABLED=true
      - APP_MASTER_KEY_FILE=/run/secrets/app_master_key.txt
      - NEW_APP_MASTER_KEY_FILE=/run/secrets/new_app_master_key.txt
      - APP_CONFIG_REKEY=false
      - GLOB_USER_MODEL_TTL=1440
      - REDIS_ADDR=air_redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - MINIO_INTERNAL_ENDPOINT=minio:9000
      - MINIO_BUCKET=user-files
      - MINIO_ACCESS_KEY=root
      - MINIO_SECRET_KEY_FILE=/run/secrets/minio_root_password.txt
      # ── SQL время отмены контекста долгих операций в секундах ──────────────────────────────────────────────────────
      - GLOB_SQL_CTX_CANCEL=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_internal
      - air_shared
      - monitoring_shared

  envoy:
    image: envoyproxy/envoy:v1.32-latest
    container_name: airorc_envoy
    restart: unless-stopped
    ports:
      - "443:443"
      - "50443:50443"  # gRPC-Web endpoint for the local frontend
      - "3006:3006"  # Порт БД для внешнего доступа через Envoy
    volumes:
      - ./envoy/envoy.dev.yaml:/etc/envoy/envoy.yaml:ro
      - ./localhost.pem:/etc/envoy/certs/localhost.pem:ro
      - ./localhost-key.pem:/etc/envoy/certs/localhost-key.pem:ro
      - ./host.pem:/etc/envoy/certs/host.pem:ro
      - ./host-key.pem:/etc/envoy/certs/host-key.pem:ro
    depends_on:
      - airorc
    networks:
      - app_internal
      - air_shared

networks:
  app_internal:
    name: app_internal
    driver: bridge
    external: true
  air_shared:
    name: air_shared
    external: true
  monitoring_shared:
    name: monitoring_shared
    external: true
