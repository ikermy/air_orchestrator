name: Deploy AiR_Orchestrator Production
on:
  push:
    branches:
      - master
env:
  REGISTRY: ghcr.io
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/airorc:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/airorc:prod
          build-args: |
            GO_BUILD_TAGS=prod
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Copy configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "prod.yml,air-db.yml,air-loki.yml,air-mon.yml,air-promtail.yml,air-redis.yml,air-s3.yml,minio-cors.json,envoy/envoy.prod.yaml,monitoring/"
          target: "/bot/marusia/air_orc"
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /bot/marusia/air_orc
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            mkdir -p secrets envoy monitoring
            [ -f "envoy.prod.yaml" ] && mv envoy.prod.yaml envoy/envoy.prod.yaml
            printf '%s' "${{ secrets.MINIO_ROOT_PASSWORD }}" > secrets/minio_root_password.txt
            test -s secrets/minio_root_password.txt
            test -n "${{ secrets.FRONTEND_ORIGIN }}"
            sed -i "s|FRONTEND_ORIGIN_PLACEHOLDER|${{ secrets.FRONTEND_ORIGIN }}|g" minio-cors.json
            docker network inspect app_internal >/dev/null 2>&1 || docker network create app_internal
            docker network inspect air_shared >/dev/null 2>&1 || docker network create air_shared
            docker network inspect monitoring_shared >/dev/null 2>&1 || docker network create monitoring_shared
            # 1. Create .env file for Docker Compose
            echo "DOCKER_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/airorc:${{ github.sha }}" > .env
            echo "DOCKER_IMAGE_ALIAS=${{ env.REGISTRY }}/${{ github.repository_owner }}/airorc:prod" >> .env
            echo "DOMAIN=${{ secrets.DOMAIN }}" >> .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "NOTIF_TG_IDS=${{ vars.TG_IDS }}" >> .env
            chmod 600 .env
            # 2. Write permanent secret files
            if [ ! -z "${{ secrets.MYSQL_ROOT_PASSWORD }}" ]; then echo "${{ secrets.MYSQL_ROOT_PASSWORD }}" > secrets/mysql_root_password.txt; fi
            if [ ! -z "${{ secrets.APP_MASTER_KEY }}" ]; then echo "${{ secrets.APP_MASTER_KEY }}" > secrets/app_master_key.txt; fi
            # 3. Start infrastructure
            docker compose -f air-db.yml up -d
            docker compose -f air-redis.yml up -d
            docker compose -f air-loki.yml up -d
            docker compose -f air-mon.yml up -d
            docker compose -f air-promtail.yml up -d
            docker compose -f air-s3.yml up -d
            docker compose -f air-s3.yml run --rm minio-init
            # 4. Deploy app (it will pick up DOMAIN from .env automatically)
            docker compose -f prod.yml pull
            docker compose -f prod.yml up -d --force-recreate
            docker compose -f prod.yml ps
            docker compose -f air-s3.yml ps
            docker run --rm --network app_internal curlimages/curl:8.10.1 -fsS http://airorc:8080/v1/storage/health >/dev/null
            docker image prune -f
