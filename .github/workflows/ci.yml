name: CI AirOrchestrator

on:
  pull_request:
    branches:
      - master
  push:
    branches-ignore:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    name: Setup, test, and build project
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build application
        # prod-тег отключает swagger (см. internal/delivery/http/swagger_disabled.go)
        run: go build -trimpath -tags prod -ldflags="-s -w" ./...

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...
