name: CD AirOrchestrator Production

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    name: Setup, test, and build project
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build application
        # prod-тег отключает swagger (см. internal/delivery/http/swagger_disabled.go)
        run: go build -trimpath -tags prod -ldflags="-s -w" ./...

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    name: Build and push image
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/airorc:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/airorc:prod
          build-args: |
            GO_BUILD_TAGS=prod

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    name: Deploy to production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Значения секретов переносим в base64: иначе кавычки, `$`, пробелы и CRLF
      # искажают их, и в .env уезжает неверный DB_PASSWORD.
      - name: Prepare deploy secrets
        id: prepare
        shell: bash
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DOMAIN: ${{ secrets.DOMAIN }}
          NOTIF_TG_IDS: ${{ vars.TG_IDS }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          APP_MASTER_KEY: ${{ secrets.APP_MASTER_KEY }}
        run: |
          set -euo pipefail
          for name in DB_USER DB_PASSWORD DOMAIN NOTIF_TG_IDS FRONTEND_ORIGIN MINIO_ROOT_PASSWORD MYSQL_ROOT_PASSWORD APP_MASTER_KEY; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
            encoded=$(printf '%s' "$value" | tr -d '\r\n' | base64 -w0)
            echo "${name,,}_b64=$encoded" >> "$GITHUB_OUTPUT"
          done

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          printf '\n' >> ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts

      - name: Copy configs to server
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          for i in $(seq 1 5); do
            if scp -r -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i ~/.ssh/id_deploy \
                prod.yml air-db.yml air-loki.yml air-mon.yml air-promtail.yml air-redis.yml air-s3.yml minio-cors.json envoy monitoring \
                "$USERNAME@$HOST:/bot/marusia/air_orc/"; then
              echo "scp OK (attempt $i)"
              exit 0
            fi
            echo "scp attempt $i failed; retry in 15s"
            sleep 15
          done
          echo "scp failed after 5 attempts"
          exit 1

      - name: Deploy to server via SSH
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REGISTRY: ${{ env.REGISTRY }}
          REPO_OWNER: ${{ github.repository_owner }}
          GIT_SHA: ${{ github.sha }}
          DOMAIN_B64: ${{ steps.prepare.outputs.domain_b64 }}
          DB_USER_B64: ${{ steps.prepare.outputs.db_user_b64 }}
          DB_PASSWORD_B64: ${{ steps.prepare.outputs.db_password_b64 }}
          NOTIF_TG_IDS_B64: ${{ steps.prepare.outputs.notif_tg_ids_b64 }}
          FRONTEND_ORIGIN_B64: ${{ steps.prepare.outputs.frontend_origin_b64 }}
          MINIO_ROOT_PASSWORD_B64: ${{ steps.prepare.outputs.minio_root_password_b64 }}
          MYSQL_ROOT_PASSWORD_B64: ${{ steps.prepare.outputs.mysql_root_password_b64 }}
          APP_MASTER_KEY_B64: ${{ steps.prepare.outputs.app_master_key_b64 }}
        run: |
          cat > /tmp/remote-deploy.sh <<'REMOTE'
          set -u
          cd /bot/marusia/air_orc
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          mkdir -p secrets envoy monitoring
          [ -f "envoy.prod.yaml" ] && mv envoy.prod.yaml envoy/envoy.prod.yaml || true

          # base64-декодер: значения секретов переносятся байт-в-байт.
          decode() { printf '%s' "$1" | base64 -d; }

          # 1. Постоянные secret-файлы (без завершающего \n)
          decode "$MINIO_ROOT_PASSWORD_B64" > secrets/minio_root_password.txt
          test -s secrets/minio_root_password.txt
          [ -n "$MYSQL_ROOT_PASSWORD_B64" ] && decode "$MYSQL_ROOT_PASSWORD_B64" > secrets/mysql_root_password.txt
          [ -n "$APP_MASTER_KEY_B64" ] && decode "$APP_MASTER_KEY_B64" > secrets/app_master_key.txt

          # 2. CORS для MinIO
          FRONTEND_ORIGIN="$(decode "$FRONTEND_ORIGIN_B64")"
          test -n "$FRONTEND_ORIGIN"
          sed -i "s|FRONTEND_ORIGIN_PLACEHOLDER|$FRONTEND_ORIGIN|g" minio-cors.json

          # 3. Сети
          docker network inspect app_internal >/dev/null 2>&1 || docker network create app_internal
          docker network inspect air_shared >/dev/null 2>&1 || docker network create air_shared
          docker network inspect monitoring_shared >/dev/null 2>&1 || docker network create monitoring_shared

          # 4. .env для Docker Compose
          DOMAIN_DEC="$(decode "$DOMAIN_B64")"
          DB_USER_DEC="$(decode "$DB_USER_B64")"
          DB_PASSWORD_DEC="$(decode "$DB_PASSWORD_B64")"
          NOTIF_TG_IDS_DEC="$(decode "$NOTIF_TG_IDS_B64")"
          echo "deploy: DB_USER='$DB_USER_DEC' DB_PASSWORD length=${#DB_PASSWORD_DEC}"
          {
            printf 'DOCKER_IMAGE=%s\n' "$REGISTRY/$REPO_OWNER/airorc:$GIT_SHA"
            printf 'DOCKER_IMAGE_ALIAS=%s\n' "$REGISTRY/$REPO_OWNER/airorc:prod"
            printf 'DOMAIN='; printf '%s' "$DOMAIN_DEC"; printf '\n'
            printf 'DB_USER='; printf '%s' "$DB_USER_DEC"; printf '\n'
            printf 'DB_PASSWORD='; printf '%s' "$DB_PASSWORD_DEC"; printf '\n'
            printf 'NOTIF_TG_IDS='; printf '%s' "$NOTIF_TG_IDS_DEC"; printf '\n'
          } > .env
          chmod 600 .env

          # 5. Инфраструктура
          docker compose -f air-db.yml up -d
          docker compose -f air-redis.yml up -d
          docker compose -f air-loki.yml up -d
          docker compose -f air-mon.yml up -d
          docker compose -f air-promtail.yml up -d
          docker compose -f air-s3.yml up -d
          docker compose -f air-s3.yml run --rm minio-init

          # 6. Приложение
          docker compose -f prod.yml pull
          docker compose -f prod.yml up -d --force-recreate
          docker compose -f prod.yml ps
          docker compose -f air-s3.yml ps
          docker run --rm --network app_internal curlimages/curl:8.10.1 -fsS http://airorc:8080/v1/storage/health >/dev/null
          docker image prune -f
          REMOTE

          for i in $(seq 1 5); do
            if ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i ~/.ssh/id_deploy "$USERNAME@$HOST" \
                "GH_TOKEN='$GH_TOKEN' ACTOR='$ACTOR' REGISTRY='$REGISTRY' REPO_OWNER='$REPO_OWNER' GIT_SHA='$GIT_SHA' DOMAIN_B64='$DOMAIN_B64' DB_USER_B64='$DB_USER_B64' DB_PASSWORD_B64='$DB_PASSWORD_B64' NOTIF_TG_IDS_B64='$NOTIF_TG_IDS_B64' FRONTEND_ORIGIN_B64='$FRONTEND_ORIGIN_B64' MINIO_ROOT_PASSWORD_B64='$MINIO_ROOT_PASSWORD_B64' MYSQL_ROOT_PASSWORD_B64='$MYSQL_ROOT_PASSWORD_B64' APP_MASTER_KEY_B64='$APP_MASTER_KEY_B64' bash -s" < /tmp/remote-deploy.sh; then
              echo "deploy OK (attempt $i)"
              exit 0
            fi
            echo "deploy attempt $i failed; retry in 15s"
            sleep 15
          done
          echo "deploy failed after 5 attempts"
          exit 1
