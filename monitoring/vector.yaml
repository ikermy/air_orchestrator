data_dir: /var/lib/vector

sources:
  docker:
    type: docker_logs
    docker_host: unix:///var/run/docker.sock
    # Собираем логи всех контейнеров, кроме самого стека наблюдаемости
    # (у части сервисов метка logging=loki может отсутствовать).
    exclude_containers:
      - airorc_vector
      - airorc_perses
      - airorc_victoriametrics
      - airorc_victorialogs
      - cadvisor

transforms:
  enrich:
    type: remap
    inputs:
      - docker
    source: |
      # Пробрасываем docker-метки в отдельные поля, как в Promtail.
      .app = .label.app
      .service = .label.service
      .tier = .label.tier
      .job = "docker"
      .source = "vector"
      del(.label)
      del(.source_type)

sinks:
  vlogs:
    type: elasticsearch
    inputs:
      - enrich
    endpoints:
      - http://victorialogs:9428/insert/elasticsearch/
    mode: bulk
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: container_name,app,service,tier,stream
