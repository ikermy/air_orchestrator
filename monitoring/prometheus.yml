  - job_name: "widget"
    static_configs:
      - targets:
          - "widget:8080"
    metrics_path: "/metrics"
    scheme: "http"

  - job_name: "hunter"
    static_configs:
      - targets:
          - "hunter:8080"
    metrics_path: "/metrics"
