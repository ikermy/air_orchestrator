openapi: "3.0.3"
info:
  title: AiR ORCHESTRATOR API
  description: |
    REST API сервиса AiR ORCHESTRATOR. Большинство защищённых маршрутов требуют
    заголовок `Authorization: Bearer <token>`. WebSocket-маршруты принимают
    токен через query-параметр `token` или через `Sec-WebSocket-Protocol`.
  version: "1.0.0"

servers:
  - url: https://localhost:8443
    description: Локальная разработка (TLS)
  - url: http://localhost:8080
    description: Production (за nginx)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: Короткоживущий access-token (STA)
        confirmed:
          type: integer
        disabled:
          type: integer

    AccessToken:
      type: object
      properties:
        s:
          type: string
          description: Новый STA-токен

tags:
  - name: auth
    description: Аутентификация, токены, сброс пароля
  - name: totp
    description: Двухфакторная аутентификация (TOTP / Google Authenticator)
  - name: channel
    description: Пользовательский канал
  - name: demo
    description: Демо-режим (без авторизации)
  - name: widget
    description: Виджет-режим
  - name: pay
    description: Платёжная подсистема
  - name: dialog
    description: Диалоги пользователя
  - name: model
    description: Управление AI-моделями
  - name: nota
    description: Уведомления и настройки
  - name: notification
    description: Отправка уведомлений (внешние сервисы)
  - name: user
    description: Данные пользователя
  - name: master-key
    description: MasterKey — шифрование данных пользователя
  - name: s3
    description: Файловое хранилище S3
  - name: embedding
    description: Текстовые эмбеддинги (RAG)
  - name: operators
    description: Операторы
  - name: services
    description: Пользовательские сервисы
  - name: mcp
    description: MCP-сервер (Model Context Protocol)
  - name: crm
    description: CRM-прокси (AmoCRM)
  - name: google
    description: Google OAuth
  - name: avito
    description: Avito-интеграция
  - name: ws
    description: WebSocket-эндпоинты
  - name: test-api
    description: Тестовый API (AI-модель)
  - name: dev
    description: Инструменты разработчика / admin
  - name: system
    description: Системные эндпоинты (доступность, permit, uid, метрики)
  - name: misc
    description: Прочие маршруты

paths:

  # ─────────────── SYSTEM / MISC ───────────────
  /metrics:
    get:
      tags: [system]
      summary: Prometheus-метрики приложения
      description: |
        Экспортирует метрики в формате text/plain (Prometheus exposition format).
        Не требует авторизации. Рекомендуется закрыть от внешнего доступа на уровне nginx.
      responses:
        "200":
          description: Метрики в формате Prometheus
          content:
            text/plain:
              schema:
                type: string
  /system/available/{ch_type}:
    get:
      tags: [system]
      summary: Проверка доступности сервиса
      parameters:
        - name: ch_type
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK

  /system/uid:
    get:
      tags: [system]
      summary: Получение userID для модели (без авторизации, для внутренних сервисов)
      parameters:
        - name: uid
          in: query
          required: true
          schema:
            type: string
          description: Входной ID пользователя
      responses:
        "200":
          description: OK

  /system/permit:
    get:
      tags: [system]
      summary: Проверка разрешений запуска сервиса
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized

  /subscription:
    get:
      tags: [pay]
      summary: Подписка
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK

  # ─────────────── AUTH ───────────────
  /auth/check-email:
    post:
      tags: [auth]
      summary: Проверка занятости email и создание промежуточного ключа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                a:
                  type: string
                  description: Email
                b:
                  type: integer
                  format: uint64
                  description: RespId (идентификатор браузера/сессии)
      responses:
        "200":
          description: Результат проверки
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: boolean
                    description: true — email уже занят
                  key:
                    type: string
                    description: Промежуточный ключ (если email свободен)
        "429":
          description: Слишком много запросов

  /auth/register:
    post:
      tags: [auth]
      summary: Регистрация нового пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [a, b, c, d]
              properties:
                a:
                  type: integer
                  format: uint64
                  description: RespId
                b:
                  type: string
                  description: Имя
                c:
                  type: string
                  description: Email
                d:
                  type: string
                  description: Зашифрованный пароль
                e:
                  type: boolean
                  description: Demo-режим
                f:
                  type: string
                  description: Язык интерфейса
      responses:
        "200":
          description: Пользователь создан, письмо отправлено
        "400":
          description: Ошибка входных данных
        "429":
          description: Слишком много запросов

  /auth/session-key:
    post:
      tags: [auth]
      summary: Создание промежуточного ключа для шифрования пароля
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [a]
              properties:
                a:
                  type: integer
                  format: uint64
                  description: RespId
      responses:
        "200":
          description: Ключ создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string

  /auth/reset-password/request:
    post:
      tags: [auth]
      summary: Запрос восстановления пароля (отправляет письмо)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                a:
                  type: integer
                  format: uint64
                  description: RespId
                b:
                  type: string
                  description: Email
      responses:
        "200":
          description: Результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  a:
                    type: boolean

  /auth/reset-password/validate:
    post:
      tags: [auth]
      summary: Проверка токена для сброса пароля
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                a:
                  type: integer
                  format: uint64
                  description: RespId
                b:
                  type: string
                  description: Токен из письма
      responses:
        "200":
          description: Токен валиден
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  email:
                    type: string
                  token:
                    type: string
        "401":
          description: Токен невалиден

  /auth/reset-password/confirm:
    post:
      tags: [auth]
      summary: Сброс пароля
      description: |
        Устанавливает новый пароль по токену из письма.

        **Поведение поля `d` (raw_master_key):**
        - **Передан** — MasterKey перешифровывается с новым паролем, доступ к зашифрованным данным сохраняется.
        - **Не передан, и MasterKey был создан** — все зашифрованные данные пользователя безвозвратно удаляются, MasterKey сбрасывается (`NULL`). Пользователь сможет создать новый MasterKey через `POST /user/master-key`.
        - **Не передан, и MasterKey не создавался** — ничего не происходит, смена пароля выполняется штатно.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [a, b, c]
              properties:
                a:
                  type: string
                  description: JWT access-token из /checkreset
                b:
                  type: string
                  description: Email
                c:
                  type: string
                  description: Новый зашифрованный пароль (AES-CBC)
                d:
                  type: string
                  description: |
                    Raw MasterKey (base64, опционально).
                    Если передан — MasterKey перешифровывается с новым паролем.
                    Если НЕ передан и MasterKey существует — все зашифрованные данные
                    пользователя будут безвозвратно удалены и MasterKey сброшен.
      responses:
        "200":
          description: Пароль изменён
        "400":
          description: Невалидный raw_master_key или ошибка расшифровки пароля
        "401":
          description: Токен невалиден
        "429":
          description: Слишком много запросов

  /auth/email/confirm:
    get:
      tags: [auth]
      summary: Подтверждение email-адреса (переход по ссылке из письма)
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
          description: Токен подтверждения
      responses:
        "302":
          description: Редирект на главную страницу с результатом

  /auth/token/refresh:
    get:
      tags: [auth]
      summary: Обновление access-token на основе refresh-token из cookie
      responses:
        "200":
          description: Новый STA-токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          description: Невалидный или отсутствующий refresh-token

  /auth/token/validate:
    get:
      tags: [auth]
      summary: Валидация access-token
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Токен валиден
        "401":
          description: Токен невалиден

  /auth/login:
    post:
      tags: [auth]
      summary: Авторизация пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [a, b, c]
              properties:
                a:
                  type: integer
                  format: uint64
                  description: RespId
                b:
                  type: string
                  description: Email
                c:
                  type: string
                  description: Зашифрованный пароль
                d:
                  type: boolean
                  description: Авто-вход (refresh-token в cookie)
      responses:
        "200":
          description: Токен выдан или требуется второй фактор
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TokenResponse"
                  - type: object
                    description: TOTP required
                    properties:
                      status:
                        type: string
                        example: totp_required
                      totp_token:
                        type: string
        "401":
          description: Неверные учётные данные

  # ─────────────── TOTP ───────────────
  /totp/setup:
    post:
      tags: [totp]
      summary: Генерация TOTP secret и URI QR-кода
      security:
        - BearerAuth: []
      responses:
        "200":
          description: URI для сканирования QR
          content:
            application/json:
              schema:
                type: object
                properties:
                  uri:
                    type: string
                    description: otpauth:// URI
                  enabled:
                    type: boolean
                    example: false
        "401":
          description: Unauthorized

  /totp/confirm:
    post:
      tags: [totp]
      summary: Активация TOTP после проверки 6-значного кода
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: 6-значный TOTP-код из приложения
                  example: "123456"
      responses:
        "200":
          description: TOTP активирован
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    example: true
        "400":
          description: TOTP не настроен или уже включён
        "401":
          description: Неверный код

  /totp:
    delete:
      tags: [totp]
      summary: Отключение TOTP с проверкой 6-значного одноразового кода
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: 6-значный TOTP-код из приложения
                  example: "123456"
      responses:
        "200":
          description: TOTP отключён
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    example: false
        "400":
          description: TOTP не включён
        "401":
          description: Неверный код

  /auth/totp:
    post:
      tags: [totp]
      summary: Второй шаг входа — ввод TOTP-кода
      description: |
        Вызывается после POST /auth, если сервер вернул `status: totp_required`.
        Принимает временный `totp_token` и 6-значный код из приложения.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totp_token, code]
              properties:
                totp_token:
                  type: string
                  description: Временный токен из ответа POST /auth
                code:
                  type: string
                  description: 6-значный TOTP-код
                  example: "123456"
      responses:
        "200":
          description: Авторизация выполнена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Истёкший токен или неверный код

  # ─────────────── CHANNEL ───────────────
  /channel/name:
    get:
      tags: [channel]
      summary: Получить имя канала
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK

  /channel:
    get:
      tags: [channel]
      summary: Читать данные канала
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
    post:
      tags: [channel]
      summary: Сохранить данные канала
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
    delete:
      tags: [channel]
      summary: Удалить канал
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK

  # ─────────────── DEMO ───────────────
  /demo/exam:
    post:
      tags: [demo]
      summary: Демо-экзамен (проверка конфигурации)
      responses:
        "200":
          description: OK

  /demo/username:
    get:
      tags: [demo]
      summary: Получить имя демо-пользователя
      responses:
        "200":
          description: OK

  /demo/dialog:
    get:
      tags: [demo]
      summary: Прочитать демо-диалог
      responses:
        "200":
          description: OK

  /demo/data:
    post:
      tags: [demo]
      summary: Отправить данные в демо
      responses:
        "200":
          description: OK

  /demo/events:
    get:
      tags: [demo]
      summary: SSE/события демо-режима
      responses:
        "200":
          description: OK

  # ─────────────── TEST API ───────────────
  /api/test/start:
    get:
      tags: [test-api]
      summary: Запуск тестовой сессии AI-модели
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK

  /api/test/ask:
    post:
      tags: [test-api]
      summary: Отправить вопрос тестовой модели
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK

  /api/test/stop:
    delete:
      tags: [test-api]
      summary: Остановить тестовую сессию
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK

  # ─────────────── WIDGET ───────────────
  /widget/code:
    get:
      tags: [widget]
      summary: Получить код виджета
      responses:
        "200":
          description: OK

  /widget/exam:
    post:
      tags: [widget]
      summary: Проверка виджета
      responses:
        "200":
          description: OK

  /widget/validate:
    get:
      tags: [widget]
      summary: Валидация токена виджета
      responses:
        "200":
          description: OK

  /widget/refresh:
    post:
      tags: [widget]
      summary: Обновить токен виджета
      responses:
        "200":
          description: OK

  /widget/username:
    get:
      tags: [widget]
      summary: Получить имя пользователя виджета
      responses:
        "200":
          description: OK

  /widget/dialog:
    get:
      tags: [widget]
      summary: Прочитать диалог виджета
      responses:
        "200":
          description: OK

  /widget/data:
    post:
      tags: [widget]
      summary: Отправить данные через виджет
      responses:
        "200":
          description: OK

  /widget/events:
    get:
      tags: [widget]
      summary: SSE/события виджета
      responses:
        "200":
          description: OK

  # ─────────────── PAY ───────────────
  /pay/tariff:
    get:
      tags: [pay]
      summary: Получить тарифы
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK

  /pay/currencies:
    get:
      tags: [pay]
      summary: Получить доступные валюты
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK

  /pay/create-payment:
    post:
      tags: [pay]
      summary: Создать платёж ByBit
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK

  /pay/payment-status-stream:
    get:
      tags: [pay]
      summary: SSE-поток статуса платежа
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Server-Sent Events stream

  # ─────────────── DIALOG ───────────────
  /dialog/all:
    get:
      tags: [dialog]
      summary: Получить все диалоги пользователя
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK

  /dialog/view/{id}:
    post:
      tags: [dialog]
      summary: Получить конкретный диалог
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK

  /dialog/{id}:
    delete:
      tags: [dialog]
      summary: Удалить диалог по ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK

  /dialog/list:
    delete:
      tags: [dialog]
      summary: Удалить список диалогов
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: OK

  # ─────────────── DETAILS ───────────────
  /user/details:
    get:
      tags: [user]
      summary: Получить детальные данные пользователя (статистика)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK

  # ─────────────── PROVIDER ───────────────
  /provider/available:
    get:
      tags: [model]
      summary: Список провайдеров с установленным и без API-ключа для данного пользователя
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: array
                    items:
                      type: string
                    description: Провайдеры с API-ключом (openai, mistral, ...)
                  unavailable:
                    type: array
                    items:
                      type: string
                    description: Провайдеры без API-ключа
        "401":
          description: Unauthorized

  /provider/revoke:
    delete:
      tags: [model]
      summary: Отозвать API-ключ пользователя для выбранного провайдера
      security:
        - BearerAuth: []
      parameters:
        - name: providerStr
          in: query
          required: true
          schema:
            type: string
          description: Код провайдера, например openai или mistral
      responses:
        "200":
          description: API-ключ отозван
          content:
            application/json:
              schema:
                type: object
                properties:
                  restart:
                    type: boolean
                    description: Нужно ли перезапустить активную модель после отзыва ключа
        "400":
          description: Не указан providerStr или передан невалидный provider
        "401":
          description: Unauthorized
        "500":
          description: Внутренняя ошибка

  /provider/setkey:
    post:
      tags: [model]
      summary: Установить API-ключ пользователя для выбранного провайдера
      security:
        - BearerAuth: []
      parameters:
        - name: providerStr
          in: query
          required: true
          schema:
            type: string
          description: Код провайдера, например openai или mistral
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
