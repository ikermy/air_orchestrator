  # ─────────────── MASTER KEY ───────────────
  # POST /user/master-key удалён — создание MasterKey перенесено на WebSocket /ws/create-master-key

  /auth/rewrap-master-key:
    post:
      tags: [masterkey]
      summary: Перешифровать MasterKey с новым паролем. Если raw key не передан — удаляет зашифрованные данные.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [a, c]
              properties:
                a:
                  type: integer
                  format: uint64
                  description: respId из POST /key (свежий, TTL 30 сек)
                b:
                  type: string
                  description: Raw MasterKey base64 (опционально). Если не передан — зашифрованные данные удаляются, MasterKey сбрасывается в NULL
                c:
                  type: string
                  description: Новый пароль AES-CBC
      responses:
        "200":
          description: MasterKey перешифрован (или сброшен если b не передан)
        "400":
          description: Невалидный raw_master_key или ошибка расшифровки
        "401":
          description: Unauthorized
        "500":
          description: Внутренняя ошибка

