  # ─────────────── WEBSOCKETS ───────────────
  /ws/create-master-key:
    get:
      tags: [ws, master-key]
      summary: "WebSocket: создание MasterKey пользователя"
      description: |
        Создаёт 32-байтовый MasterKey (PBKDF2 + AES-256-GCM), шифрует им
        существующие API-ключи и возвращает raw key **один раз**.

        **Аутентификация:** Bearer-токен через `Sec-WebSocket-Protocol` или `?token=`.

        **Query-параметры:**
        - `respId` — свежий respId из `POST /auth/session-key` (TTL 30 сек)
        - `pass` — пароль пользователя, зашифрованный AES-CBC (как при логине)

        **Сообщения сервера (JSON):**
        ```
        { "type": "progress", "message": "🔄 Проверка MasterKey..." }
        { "type": "progress", "message": "🔐 Расшифровка пароля..." }
        { "type": "progress", "message": "🔐 Генерация MasterKey..." }
        { "type": "progress", "message": "🔐 Шифрование API-ключей..." }
        { "type": "success",  "message": "✅ MasterKey создан и данные зашифрованы",
          "data": { "raw_master_key": "<base64>", "warning": "Сохраните этот ключ..." } }
        { "type": "error",    "message": "❌ <описание ошибки>" }
        ```

        После `success` или `error` сервер закрывает соединение (`CloseNormalClosure`).

        **Ошибки (через сообщение type=error):**
        - Отсутствуют параметры `respId` / `pass`
        - Некорректный формат `respId`
        - MasterKey уже существует (409-семантика)
        - Ошибка расшифровки пароля (истёк TTL / неверный ключ)
        - Неверный пароль
        - Внутренняя ошибка сервера
      security:
        - BearerAuth: []
      parameters:
        - name: respId
          in: query
          required: true
          schema:
            type: integer
            format: uint64
          description: respId из POST /auth/session-key (TTL 30 сек)
        - name: pass
          in: query
          required: true
          schema:
            type: string
          description: Пароль пользователя, зашифрованный AES-CBC
      responses:
        "101":
          description: WebSocket Upgrade — соединение установлено

  /ws/instant:
    get:
      tags: [ws]
      summary: "WebSocket: мгновенные сообщения"
      description: Токен передаётся через `Sec-WebSocket-Protocol` или query `?token=`
      security:
